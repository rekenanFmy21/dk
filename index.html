<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6366f1"><meta name="rekenan-build" content="V202.01"><title>Rekenan V202.01 — APP 1 OWNER</title><script>
/* Rekenan folder-generic version redirect.
   Works from any GitHub Pages folder that contains index.html + version.json. */
(function () {
  if (window.top !== window.self) return;
  var path = window.location.pathname;
  var base = path.endsWith('/') ? path : path.substring(0, path.lastIndexOf('/') + 1);
  var current = new URL(window.location.href);
  if (/\/index\.html$/i.test(path) && current.searchParams.get('v')) return;

  fetch('./version.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('version.json unavailable'); return r.json(); })
    .then(function(meta){
      var raw = String(meta.build || meta.version || '').replace(/^V/i,'');
      var version = raw.replace(/\./g,'');
      if (!version) return;
      var target = new URL('index.html', window.location.href);
      target.searchParams.set('v', version);
      if (window.location.href !== target.href) window.location.replace(target.href);
    })
    .catch(function(){ /* keep folder URL usable if version file is temporarily unavailable */ });
})();
</script>
